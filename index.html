<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payouts &amp; Bonuses</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <style>
    :root { --felt: #063c32; --felt-dark: #022820; --gold: #f4bc52; --gold-light: #ffe1a0; --ink: #111915; --paper: #fffdf8; --red: #c84444; --green: #229464; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 50% 10%, #116650 0%, var(--felt) 42%, var(--felt-dark) 100%); color: var(--paper); font-family: Arial, Helvetica, sans-serif; }

    .brand-mark { width: 36px; height: 36px; border: 2px solid var(--gold); color: var(--gold); display: grid; place-items: center; transform: rotate(45deg); font-size: 17px; }
    .brand-mark span { transform: rotate(-45deg); }
    .mode-switch { --mode-left: 0px; --mode-width: 0px; position: relative; isolation: isolate; display: flex; overflow: hidden; border: 1px solid #ffffff66; border-radius: 999px; }

    .mode { position: relative; z-index: 1; border: 0; padding: 10px 13px; background: transparent; color: #d4e2dc; font-size: 11px; font-weight: 800; letter-spacing: .5px; transition: color .2s ease; }
    .mode.active { color: var(--ink); }
    .category-row { position: relative; }
    .bet-setting, .flashcard-setting { position: absolute; right: 0; z-index: 1; display: flex; align-items: center; gap: 9px; padding: 8px 11px; border: 0; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 800; letter-spacing: .7px; }
    .bet-setting { top: 16px; }
    .flashcard-setting { top: 60px; }
    .bet-setting[hidden], .flashcard-setting[hidden] { display: none; }
    .bet-toggle, .flashcard-toggle { position: relative; width: 34px; height: 18px; padding: 0; border: 1px solid var(--ink); border-radius: 10px; background: transparent; }
    .bet-toggle::after, .flashcard-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); transition: transform .15s ease; }
    .bet-toggle.active, .flashcard-toggle.active { background: var(--ink); }

    .category-switch { --active-left: 0px; --active-width: 0px; position: relative; isolation: isolate; width: fit-content; max-width: 100%; display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-start; margin: 16px auto 2px; padding: 0; overflow-x: auto; border: 1px solid #ffffff66; border-radius: 999px; scrollbar-width: none; }
    .category-switch::-webkit-scrollbar { display: none; }
    .category-switch::before { position: absolute; z-index: 0; top: 0; bottom: 0; left: var(--active-left); width: var(--active-width); border-radius: 999px; background: var(--gold); content: ''; transition: left .24s ease, width .24s ease; }
    .category-switch[hidden] { display: none; }
    .category { position: relative; z-index: 1; flex: 0 0 auto; border: 0; padding: 9px 12px; background: transparent; color: #d4e2dc; font-size: 10px; font-weight: 800; letter-spacing: .6px; transition: color .2s ease; }
    .category.active { color: var(--ink); }
    .score { position: absolute; right: 0; text-align: right; }
    .score small { display: block; color: #c4d5cd; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .score strong { color: var(--gold-light); font-size: 25px; line-height: 1.2; }
    .stage { flex: 1; display: grid; place-items: center; padding: 36px 0; }

    .card.flashcard .card-body { cursor: pointer; user-select: none; }
    .card.flashcard.flipped .hand { color: #0a653e; }
    .card-head { position: relative; min-height: 88px; padding: 17px 70px; background: var(--ink); color: white; display: flex; align-items: center; justify-content: center; text-align: center; }

    .answer.roulette-answer { width: min(500px, 100%); min-height: 84px; border: 2px solid #a5aaa6; line-height: 1.35; font-size: 18px; }
    .answer:focus { border-color: var(--gold); }
    .answer.correct { border-color: var(--green); background: #ddf4e8; color: #0a653e; }

    .hint { min-height: 19px; margin: 13px 0 0; color: #6d746f; font-size: 12px; }
    .card-foot { display: flex; justify-content: center; gap: 10px; padding-top: 25px; }

    .next:disabled { opacity: .42; cursor: default; }
    .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; padding-bottom: 8px; }
    .dot { width: 10px; height: 10px; border: 1px solid #c5d6ce; transform: rotate(45deg); }
    .dot.current { border-color: var(--gold); background: var(--gold); }
    .dot.correct { border-color: #55d79d; background: #55d79d; }
    .dot.wrong { border-color: #ef7777; background: #ef7777; }

    .rules-button { border: 0; border-radius: 999px; background: var(--gold); color: var(--ink); padding: 11px 16px; font-size: 12px; font-weight: 800; letter-spacing: .5px; }
    dialog { width: min(640px, calc(100% - 32px)); max-height: calc(100vh - 32px); padding: 0; overflow: auto; border: 0; border-radius: 4px; box-shadow: 0 16px 60px #0008; }
    dialog::backdrop { background: #001a13bb; }
    .rules { padding: 27px 30px; color: var(--ink); }
    .rules h2 { margin: 0 0 20px; }
    .rules p { margin: 7px 0; }
    .rules .label { margin-top: 20px; color: #96650c; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .close { float: right; border: 0; background: none; font-size: 25px; }
    @media (max-width: 720px) { .bet-setting, .flashcard-setting { position: static; width: fit-content; margin: 12px auto 0; } }
    @media (max-width: 620px) { .shell { width: min(100% - 24px, 620px); padding-top: 18px; } .topbar { flex-wrap: wrap; justify-content: space-between; gap: 14px; } .brand, .score { position: static; } .brand { font-size: 12px; } .mode-switch { order: 3; } .card-head { padding: 15px 18px; } .card-body { padding: 32px 20px 25px; } .bottom { flex-wrap: wrap; justify-content: center; } }
  </style>

      <div class="card" id="quizCard">
        <div class="card-head"><div><p class="game" id="game"></p></div><div class="suit">♠</div></div>
        <div class="card-body"><p class="prompt" id="prompt">PAYOUT COEFFICIENT</p><p class="bet-amount" id="betAmount" hidden></p><h1 class="hand" id="hand"></h1><textarea class="answer" id="answer" aria-label="Payout coefficient" autocomplete="off" inputmode="decimal" rows="1"></textarea><p class="hint" id="hint">Type your answer, then press Enter</p><div class="card-foot"><button class="next" id="next" disabled>NEXT HAND</button></div></div>
      </div>
    </section>
    <div class="dots" id="dots" aria-label="Question progress"></div>
    <footer class="bottom"><button class="rules-button" id="rulesButton">VIEW PAYOUTS</button><span id="roundInfo">25 mixed hands · no timer</span></footer>
  </main>
  <dialog id="rules"><div class="rules" id="rulesContent"></div></dialog>

      ['Nuovo Poker', 'Nuovo Bonus', '5 cards with same color', '2'], ['Nuovo Poker', 'Nuovo Bonus', 'Ace King Queen', '5'], ['Nuovo Poker', 'Nuovo Bonus', 'Three of a kind', '8'], ['Nuovo Poker', 'Nuovo Bonus', 'Straight', '30'], ['Nuovo Poker', 'Nuovo Bonus', 'Flush', '60'], ['Nuovo Poker', 'Nuovo Bonus', 'Full House', '100'], ['Nuovo Poker', 'Nuovo Bonus', '5 images (K/Q/J)', '120'], ['Nuovo Poker', 'Nuovo Bonus', 'Four of a kind', '200']

    const mixedBonuses = [

      ...bonuses.filter(([gameName, payoutCategory]) => gameName === 'Texas Poker' && payoutCategory === 'E-BONUS').map(([, , handName, value]) => ['5 Card Poker', 'E-BONUS', handName, value])

    const rouletteWheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

    const rouletteMultiplicationQuestions = [8, 11, 17, 35].flatMap(multiplier => Array.from({ length: 20 }, (_, index) => {
      const factor = index + 1;
      return ['Roulette', 'Multiplication', `${multiplier} × ${factor}`, String(multiplier * factor)];
    }));
    const game = document.querySelector('#game'), hand = document.querySelector('#hand'), answer = document.querySelector('#answer'), hint = document.querySelector('#hint'), score = document.querySelector('#score'), next = document.querySelector('#next'), dots = document.querySelector('#dots'), roundInfo = document.querySelector('#roundInfo'), rulesContent = document.querySelector('#rulesContent'), categorySwitch = document.querySelector('#categorySwitch'), modeSwitch = document.querySelector('#modeSwitch'), prompt = document.querySelector('#prompt'), rulesButton = document.querySelector('#rulesButton'), betSetting = document.querySelector('.bet-setting'), betToggle = document.querySelector('#betToggle'), flashcardSetting = document.querySelector('.flashcard-setting'), flashcardToggle = document.querySelector('#flashcardToggle'), betAmount = document.querySelector('#betAmount'), quizCard = document.querySelector('#quizCard');
    let mode = 'regular', category = 'mixed', betAmountsEnabled = false, flashcardsEnabled = false, activeBet = null, deck = [], index = 0, correct = 0, checked = false, flashcardRevealed = false, results = [];

    const randomBet = () => mode === 'bonus' ? 5 + Math.floor(Math.random() * 20) * 5 : 25 + Math.floor(Math.random() * 56) * 5;
    function usesBetAmount(question = deck[index]) { return betAmountsEnabled && mode !== 'roulette' && question && question[0] !== 'BJ' && question[3] !== 'jackpot'; }
    function stakeLabel(question = deck[index]) { if (mode !== 'regular' || !question) return 'BET'; if (question[0] === 'Texas Poker') return 'ANTE'; if (question[0] === 'Ultimate Texas Poker') return 'BLIND'; return 'BET'; }
    function expectedAnswer(question = deck[index]) { if (!usesBetAmount(question)) return question[3]; const payout = Number(question[3]) * activeBet; return String(question[0] === 'Texas Poker' && mode === 'regular' ? payout + activeBet * 2 : payout); }
    function categoriesForMode() { return mode === 'regular' ? [['mixed', 'MIXED'], ['Ultimate Texas Poker', 'ULTIMATE TEXAS'], ['Texas Poker', 'TEXAS'], ['Russian Poker', 'RUSSIAN'], ['BJ', 'BJ']] : [['mixed', 'MIXED'], ['Blackjack', 'BLACKJACK'], ['Ultimate Texas Poker', 'ULTIMATE TEXAS'], ['Texas Poker', 'TEXAS'], ['Russian Poker', 'RUSSIAN'], ['Nuovo Poker', 'NUOVO']]; }

    function checkAnswer() { if (checked || !answer.value.trim()) return; checked = true; const expected = expectedAnswer(); const entered = normalize(answer.value); const compactBlackjackPayout = deck[index][0] === 'BJ' && expected.endsWith('.5') && Number(entered) === Number(expected) * 10; const isWheel = mode === 'roulette' && category === 'wheel'; const ok = isWheel ? normalizeWheelOrder(answer.value) === normalizeWheelOrder(expected) : entered === normalize(expected) || compactBlackjackPayout; answer.classList.add(ok ? 'correct' : 'wrong'); results[index] = ok ? 'correct' : 'wrong'; if (ok) { correct += 1; hint.textContent = 'Correct'; } else { hint.textContent = `Correct answer: ${mode === 'roulette' ? expected : activeBet ? expected : answerText(expected, deck[index][0])}`; } score.textContent = `${correct} / ${deck.length}`; next.textContent = 'NEXT HAND'; renderDots(); }
    function nextHand() { if (!checked) return; if (index < deck.length - 1) { index += 1; render(); } else { hand.textContent = 'Round complete'; game.textContent = `FINAL SCORE · ${correct} OF ${deck.length}`; answer.style.display = 'none'; hint.textContent = 'Start a new round to reshuffle all payouts.'; next.disabled = true; renderDots(); } }
    function renderRules() { rulesContent.replaceChildren(); const close = document.createElement('button'); close.className = 'close'; close.setAttribute('aria-label', 'Close'); close.textContent = '×'; close.addEventListener('click', () => document.querySelector('#rules').close()); const title = document.createElement('h2'); title.textContent = mode === 'roulette' ? category === 'multiplication' ? 'Roulette Multiplication' : 'Roulette Wheel Order' : mode === 'bonus' ? 'Bonus Payouts' : 'Regular Payouts'; rulesContent.append(close, title); if (mode === 'roulette') { const line = document.createElement('p'); line.textContent = category === 'multiplication' ? 'Solve the multiplication question. Tables: 8, 11, 17, and 35, each multiplied by 1 through 20.' : rouletteWheel.join('  '); rulesContent.append(line); return; } const groups = new Map(); currentPool().forEach(([gameName, payoutCategory, handName, value]) => { const key = `${gameName} · ${payoutCategory}`; if (!groups.has(key)) groups.set(key, []); groups.get(key).push([handName, value, gameName]); }); groups.forEach((entries, label) => { const heading = document.createElement('p'); heading.className = 'label'; heading.textContent = label; rulesContent.append(heading); entries.forEach(([handName, value, gameName]) => { const line = document.createElement('p'); line.textContent = `${handName}: ${answerText(value, gameName)}`; rulesContent.append(line); }); }); }
    function newRound() { deck = shuffled(currentPool()); index = 0; correct = 0; results = []; answer.style.display = ''; roundInfo.textContent = mode === 'roulette' ? `${deck.length} ${category === 'multiplication' ? 'multiplication questions' : 'wheel positions'} · no timer` : `${deck.length} ${category === 'mixed' ? 'mixed' : category.toLowerCase()} ${mode === 'bonus' ? 'bonus' : 'regular'} hands · no timer`; rulesButton.textContent = mode === 'roulette' ? category === 'multiplication' ? 'ABOUT MULTIPLICATION' : 'VIEW WHEEL ORDER' : 'VIEW PAYOUTS'; renderCategories(); renderRules(); render(); }
    answer.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      if (checked) nextHand(); else checkAnswer();
    });
    quizCard.addEventListener('click', event => {
      const isFlashcard = (mode === 'roulette' && category === 'multiplication') || (mode !== 'roulette' && flashcardsEnabled);
      if (!isFlashcard || event.target.closest('button') || next.disabled) return;
      if (flashcardRevealed) { nextHand(); return; }
      flashcardRevealed = true;
      quizCard.classList.add('flipped');
      hand.textContent = activeBet ? expectedAnswer() : answerText(expectedAnswer(), deck[index][0]);
      prompt.textContent = 'ANSWER';
    });
    next.addEventListener('click', () => { if (checked) nextHand(); else checkAnswer(); });
    betToggle.addEventListener('click', () => { betAmountsEnabled = !betAmountsEnabled; betToggle.classList.toggle('active', betAmountsEnabled); betToggle.setAttribute('aria-pressed', String(betAmountsEnabled)); newRound(); });
    flashcardToggle.addEventListener('click', () => { flashcardsEnabled = !flashcardsEnabled; flashcardToggle.classList.toggle('active', flashcardsEnabled); flashcardToggle.setAttribute('aria-pressed', String(flashcardsEnabled)); newRound(); });
    function updateModeIndicator() { const active = modeSwitch.querySelector('.mode.active'); if (!active) return; modeSwitch.style.setProperty('--mode-left', `${active.offsetLeft}px`); modeSwitch.style.setProperty('--mode-width', `${active.offsetWidth}px`); }
    document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; category = mode === 'roulette' ? 'wheel' : 'mixed'; document.querySelectorAll('.mode').forEach(item => item.classList.toggle('active', item === button)); requestAnimationFrame(updateModeIndicator); newRound(); }));
    const dialog = document.querySelector('#rules'); document.querySelector('#rulesButton').addEventListener('click', () => dialog.showModal());
    requestAnimationFrame(updateModeIndicator);
    newRound();
  </script>
</body>
